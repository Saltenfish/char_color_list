<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色配色表</title>
<style>
  :root, [data-theme="dark"]{
    --bg:#12131a;
    --panel:#1c1e29;
    --panel-2:#232634;
    --field:#141620;
    --line:#333748;
    --ink:#eef0f6;
    --ink-dim:#9aa0b4;
    --accent:#7c8cff;
    --accent-ink:#0d0f18;
    --nm:#6f7488;
    --radius:14px;
    --g1:#1b2440;--g2:#2a1b33;
  }
  [data-theme="light"]{
    --bg:#f4f5f8;
    --panel:#ffffff;
    --panel-2:#f0f1f5;
    --field:#f7f8fb;
    --line:#d9dce4;
    --ink:#1c2030;
    --ink-dim:#5c6377;
    --accent:#4a5bd4;
    --accent-ink:#ffffff;
    --nm:#8890a0;
    --g1:#dfe6f5;--g2:#efe2f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--g1) 0%, transparent 60%),
      radial-gradient(1000px 500px at 95% 0%, var(--g2) 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","Segoe UI",system-ui,-apple-system,sans-serif;
    line-height:1.5;
    padding:32px 20px 80px;
    transition:background .25s, color .25s;
  }
  header.top{
    max-width:1180px;margin:0 auto 22px;
  }
  .head-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:16px;
  }
  header.top h1{
    font-size:30px;margin:0;letter-spacing:2px;font-weight:800;
  }
  .theme-btn{
    flex:0 0 auto;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:20px;
    padding:8px 14px;display:flex;align-items:center;gap:6px;
    transition:.15s;
  }
  .theme-btn:hover{border-color:var(--accent);}
  /* name jump nav */
  .navbar{
    display:flex;flex-wrap:wrap;gap:8px;
  }
  .navbar a{
    font-size:13px;text-decoration:none;
    background:var(--panel-2);color:var(--ink);
    border:1px solid var(--line);border-radius:20px;
    padding:5px 12px;transition:.15s;white-space:nowrap;
  }
  .navbar a:hover{border-color:var(--accent);color:var(--accent);}
  .navbar a .n{color:var(--accent);font-weight:700;margin-right:5px;}

  .grid{
    max-width:1180px;margin:0 auto;
    display:grid;gap:26px;
  }

  .card{
    background:linear-gradient(180deg,var(--panel) 0%, #191b25 100%);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .card-title{
    display:flex;align-items:baseline;gap:12px;margin:0 0 18px;
    padding-bottom:12px;border-bottom:1px solid var(--line);
  }
  .card-title .no{
    font-size:13px;color:var(--accent);font-weight:700;letter-spacing:1px;
    border:1px solid var(--accent);border-radius:8px;padding:2px 8px;
  }
  .card-title h2{margin:0;font-size:22px;letter-spacing:1px;}

  /* the four boxes as in the sketch */
  .prompts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:20px;
  }
  .pbox{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    display:flex;flex-direction:column;
  }
  .pbox .g-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;gap:8px;
  }
  .badge{
    font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;
  }
  .badge.f{background:#3a2740;color:#ffb3e6;}
  .badge.m{background:#22344a;color:#9cd0ff;}
  .cname{font-size:15px;font-weight:700;}

  .pbox-body{display:flex;gap:12px;}
  .prompt-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}
  .prompt-text{
    flex:1;font-size:12px;color:var(--ink-dim);
    background:var(--field);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;max-height:104px;overflow:auto;white-space:pre-wrap;
    word-break:break-word;
  }
  .copy-btn{
    margin-top:8px;font-size:12px;font-weight:600;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;
    padding:7px 10px;cursor:pointer;transition:.15s;
  }
  .copy-btn:hover{filter:brightness(1.12);}
  .copy-btn.done{background:#4fd08a;color:#062;}

  /* palette section */
  .palette-title{font-size:14px;color:var(--ink-dim);margin:4px 0 10px;letter-spacing:1px;}
  .pal-row{margin-bottom:12px;}
  .pal-row .lbl{font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
  .swatches{display:flex;flex-wrap:wrap;gap:8px;}
  .sw{
    display:flex;flex-direction:column;align-items:center;
    cursor:pointer;width:78px;
  }
  .sw .chip{
    width:78px;height:44px;border-radius:9px;border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
  }
  .sw .hex{font-size:10px;color:var(--ink-dim);margin-top:4px;font-family:ui-monospace,monospace;}
  .sw .nm{font-size:9px;color:var(--nm);text-align:center;line-height:1.2;}
  .sw:active .chip{transform:scale(.96);}

  /* comparison / manual color tool */
  .tool{
    margin-top:18px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;
  }
  .tool h4{margin:0 0 10px;font-size:13px;color:var(--ink-dim);letter-spacing:1px;}
  .compare{display:flex;gap:14px;align-items:stretch;}
  .stack{
    flex:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);
    display:flex;flex-direction:column;min-height:120px;
  }
  .stack .layer{flex:1;position:relative;}
  .stack .layer label{
    position:absolute;top:6px;left:8px;font-size:10px;
    background:rgba(0,0,0,.35);color:#fff;padding:2px 6px;border-radius:5px;
  }
  .controls{flex:0 0 150px;display:flex;flex-direction:column;gap:10px;justify-content:center;}
  .ctl{display:flex;flex-direction:column;gap:4px;}
  .ctl .row{display:flex;align-items:center;gap:8px;}
  .ctl label{font-size:11px;color:var(--ink-dim);}
  .ctl input[type=color]{width:38px;height:32px;border:none;background:none;padding:0;cursor:pointer;}
  .ctl input[type=text]{
    width:82px;font-family:ui-monospace,monospace;font-size:12px;
    background:var(--field);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 6px;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#4fd08a;color:#062;font-weight:700;font-size:13px;
    padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;
    transition:.25s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:720px){
    body{padding:20px 12px 60px;}
    header.top h1{font-size:24px;}
    .prompts{grid-template-columns:1fr;}
    .compare{flex-direction:column;}
    .controls{flex-direction:row;flex:none;flex-wrap:wrap;}
    .card{padding:16px;}
    .card-title h2{font-size:19px;}
    .head-row{flex-wrap:wrap;}
  }
  @media(max-width:420px){
    .sw,.sw .chip{width:64px;}
    .swatches{gap:6px;}
    .theme-btn{padding:7px 11px;font-size:12px;}
    .navbar a{font-size:12px;padding:5px 10px;}
  }
</style>
</head>

/* ---------- 建構 ---------- */
const grid = document.getElementById('grid');
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'),1100);
}
function copyText(t,label){
  navigator.clipboard.writeText(t).then(()=>showToast(label||'已複製'));
}

function promptBox(kind,data){
  const badgeClass = kind==='f'?'f':'m';
  const badgeText = kind==='f'?'女':'男';
  const box = document.createElement('div');
  box.className='pbox';
  box.innerHTML = `
    <div class="g-head">
      <span class="badge ${badgeClass}">${badgeText}</span>
      <span class="cname">${data.name}</span>
    </div>
    <div class="pbox-body">
      <div class="prompt-wrap">
        <div class="prompt-text">${data.prompt}</div>
        <button class="copy-btn">複製提示詞</button>
      </div>
    </div>`;
  // copy prompt
  const btn = box.querySelector('.copy-btn');
  btn.addEventListener('click',()=>{
    copyText(data.prompt,'提示詞已複製');
    btn.classList.add('done'); btn.textContent='已複製 ✓';
    setTimeout(()=>{btn.classList.remove('done');btn.textContent='複製提示詞';},1200);
  });
  return box;
}

function swatchRow(label,arr){
  const row = document.createElement('div');
  row.className='pal-row';
  const lbl = document.createElement('div');
  lbl.className='lbl'; lbl.textContent=label;
  row.appendChild(lbl);
  const wrap = document.createElement('div');
  wrap.className='swatches';
  arr.forEach(([hex,name])=>{
    const sw = document.createElement('div');
    sw.className='sw';
    sw.innerHTML = `<div class="chip" style="background:${hex}"></div>
                    <div class="hex">${hex}</div>
                    <div class="nm">${name}</div>`;
    sw.addEventListener('click',()=>copyText(hex, hex+' 已複製'));
    wrap.appendChild(sw);
  });
  row.appendChild(wrap);
  return row;
}

function compareTool(mainHex){
  const tool = document.createElement('div');
  tool.className='tool';
  tool.innerHTML=`
    <h4>雙色對比工具（上層預設為主要色）</h4>
    <div class="compare">
      <div class="stack">
        <div class="layer top"><label>上層</label></div>
        <div class="layer bottom"><label>下層</label></div>
      </div>
      <div class="controls">
        <div class="ctl">
          <label>上層</label>
          <div class="row">
            <input type="color" class="c-top" value="${mainHex}">
            <input type="text" class="t-top" value="${mainHex}">
          </div>
        </div>
        <div class="ctl">
          <label>下層</label>
          <div class="row">
            <input type="color" class="c-bot" value="#ffffff">
            <input type="text" class="t-bot" value="#ffffff">
          </div>
        </div>
      </div>
    </div>`;
  const topLayer = tool.querySelector('.layer.top');
  const botLayer = tool.querySelector('.layer.bottom');
  const cTop = tool.querySelector('.c-top'), tTop=tool.querySelector('.t-top');
  const cBot = tool.querySelector('.c-bot'), tBot=tool.querySelector('.t-bot');
  function apply(){
    topLayer.style.background=cTop.value;
    botLayer.style.background=cBot.value;
  }
  function sync(picker,text){
    picker.addEventListener('input',()=>{text.value=picker.value;apply();});
    text.addEventListener('input',()=>{
      if(/^#[0-9a-fA-F]{6}$/.test(text.value)){picker.value=text.value;apply();}
    });
  }
  sync(cTop,tTop); sync(cBot,tBot);
  apply();
  return tool;
}

characters.forEach(c=>{
  const card = document.createElement('div');
  card.className='card';
  card.id = 'c'+c.no;
  card.style.scrollMarginTop = '18px';

  const title = document.createElement('div');
  title.className='card-title';
  title.innerHTML=`<span class="no">${c.no}</span><h2>${c.female.name} / ${c.male.name}</h2>`;
  card.appendChild(title);

  const prompts = document.createElement('div');
  prompts.className='prompts';
  prompts.appendChild(promptBox('f',c.female));
  prompts.appendChild(promptBox('m',c.male));
  card.appendChild(prompts);

  const pt = document.createElement('div');
  pt.className='palette-title'; pt.textContent='配色表（點擊色塊複製 HEX）';
  card.appendChild(pt);
  card.appendChild(swatchRow('主調',c.palette.main));
  card.appendChild(swatchRow('進階',c.palette.adv));
  card.appendChild(swatchRow('點綴',c.palette.acc));
  card.appendChild(swatchRow('流行',c.palette.pop));
  card.appendChild(swatchRow('延伸',c.palette.ext));
  card.appendChild(swatchRow('輔助',c.palette.aux));

  card.appendChild(compareTool(c.palette.main[0][0]));

  grid.appendChild(card);
});

/* ---------- 名稱跳轉導覽 ---------- */
const navbar = document.getElementById('navbar');
characters.forEach(c=>{
  const a = document.createElement('a');
  a.href = '#c'+c.no;
  a.innerHTML = `<span class="n">${c.no}</span>${c.female.name} / ${c.male.name}`;
  navbar.appendChild(a);
});

/* ---------- 深色 / 淺色切換 ---------- */
const themeBtn = document.getElementById('themeBtn');
const root = document.documentElement;
function setTheme(t){
  root.setAttribute('data-theme', t);
  themeBtn.textContent = t==='dark' ? '🌙 深色' : '☀️ 淺色';
}
themeBtn.addEventListener('click',()=>{
  setTheme(root.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
});
</script>
